<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BITE Collect · 采集员控制台</title><link rel="stylesheet" href="/style.css"><script src="/collector.js" defer></script></head><body><header><a class="brand" href="/">BITE<span>Collect</span></a><span class="badge">SYNTHETIC DEMO</span><a href="/">参与者界面</a></header><main><div class="eyebrow">采集员工作台</div><h1>每一份进度，保存在本机。</h1><p class="intro">只展示匿名进度。真人采集关闭，正式研究仍为 BLOCKED。</p><section class="panel"><label for="key">启动终端显示的采集员访问码</label><input id="key" type="password" autocomplete="off" placeholder="仅当前服务有效"><div class="row"><button id="refresh">解锁 / 刷新</button><button id="export" class="secondary">下载 synthetic 分区导出</button><button id="lock" class="secondary">锁定</button></div><p id="message" role="status"></p></section><section id="summary"></section><div class="table-wrap"><table><thead><tr><th>匿名会话</th><th>建立时间</th><th>状态</th><th>进度</th><th>题库 hash</th></tr></thead><tbody id="sessions"></tbody></table></div><p class="footnote">导出不含同意记录、恢复码或访问凭据。训练比较、训练评分和冻结测试比较分别存放。下载后按私有文件管理；撤回后需删除已导出的副本。备份使用 run.py backup，不复制运行中的 WAL 文件。</p></main></body></html>
