<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BITE Collect · 离线偏好采集</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/">BITE<span>Collect</span></a><span class="badge">SYNTHETIC DEMO · 非正式研究</span><a href="/collector">采集员控制台</a></header>
<main><div class="eyebrow">本机离线 · 匿名会话 · 逐题保存</div><h1>让选择，留住你的口味。</h1><p class="intro">只评价预期好吃程度。50 次比较，8 次评分；随时暂停，稍后继续。</p><div id="connection" role="status">正在连接本机服务…</div><div id="error" role="alert" hidden></div><section id="screen" aria-live="polite"></section><section id="actions" hidden><button id="pause" class="secondary">暂停并保存恢复码</button><button id="next" class="secondary">下一位体验者</button><button id="withdraw" class="danger">撤回并删除本机会话</button></section><p class="footnote">文字与份量均为合成夹具。记录 research_eligible=false，禁止并入真实研究数据。无云同步，无外部图片。</p></main></body></html>
